services:
  jellyfin:
    # Pinned: album grouping (one folder = one album) and playlist behaviour the library layout relies on
    # were verified against 12.4. Re-check docs/explanation/research/jellyfin-music-metadata-research.md before upgrading.
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 502:20
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /Volumes/512GB SSD/jellyfin/config:/config
      - /Volumes/512GB SSD/jellyfin/cache:/cache
      # Logs on a named volume, same reason as the deemix service: ._ AppleDouble
      # sidecars materialise on the exFAT bind mount and EPERM on stat inside containers.
      - jellyfin-logs:/config/log
      # /media is the union root built by union_library (ADR 0004); the source trees are
      # mounted read-only at sibling paths purely so its relative symlinks resolve in-container.
      - type: bind
        source: ${MUSIC_DIR:-/Volumes/512GB SSD/Music}/Jellyfin
        target: /media
      - type: bind
        source: ${MUSIC_DIR:-/Volumes/512GB SSD/Music}/Deemix
        target: /Deemix
        read_only: true
      - type: bind
        source: ${MUSIC_DIR:-/Volumes/512GB SSD/Music}/Lidarr
        target: /Lidarr
        read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.178.43
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Polls the Deemix/Lidarr source trees and runs migrate → union_library → import once they
  # settle (spec 0004 / ADR 0005). The host tree (MUSIC_DIR) mounts at MUSIC_ROOT and the
  # watcher resolves Deemix/Jellyfin/Lidarr underneath it — the sibling layout is what keeps
  # union_library's relative symlinks (../Deemix/…) valid in Jellyfin's /media + /Deemix mounts.
  library-watcher:
    build: docker/library-watcher
    container_name: library-watcher
    user: "502:20"
    working_dir: /tools
    volumes:
      - /Volumes/512GB SSD/jellyfin:/tools:ro
      - ${MUSIC_DIR:-/Volumes/512GB SSD/Music}:${MUSIC_ROOT:-/music}
    environment:
      - PYTHONPATH=/tools
      - MUSIC_ROOT=${MUSIC_ROOT:-/music}
      # Individual roots only if the sibling layout ever breaks; unset falls back to
      # MUSIC_ROOT-derived defaults, so these stay empty in the normal case.
      - DEEMIX_ROOT=${DEEMIX_ROOT:-}
      - LIDARR_ROOT=${LIDARR_ROOT:-}
      - UNION_ROOT=${UNION_ROOT:-}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYFIN_USER=${JELLYFIN_USER}
      - JELLYFIN_MEDIA_ROOT=${JELLYFIN_MEDIA_ROOT}
      - TZ=${TZ}
      - WATCH_INTERVAL_S=${WATCH_INTERVAL_S:-30}
      - QUIET_PERIOD_S=${QUIET_PERIOD_S:-60}
      - RETRY_COOLDOWN_S=${RETRY_COOLDOWN_S:-900}
      - MIGRATE_MODE=${MIGRATE_MODE:-auto}
      - IMPORT_MODE=${IMPORT_MODE:-auto}
    restart: unless-stopped
    command: ["python3", "-m", "library_watcher"]

  deemix:
    # Pinned: reorganize_playlists replicates this version's path generation (Deemix path).
    # Re-check pathtemplates.ts before upgrading.
    image: ghcr.io/bambanah/deemix:v4.8.0
    container_name: deemix
    environment:
      - PUID=502
      - PGID=20
    ports:
      - 6595:6595
    volumes:
      - type: bind
        source: ${MUSIC_DIR:-/Volumes/512GB SSD/Music}/Deemix
        target: /downloads
      # Config (credentials, queue) lives in this repo, git-ignored, never in the scanned library.
      - /Volumes/512GB SSD/jellyfin/deemix-config:/config
      # Logs stay on a named volume: the cont-init chown pass materializes ._ AppleDouble
      # sidecars on the exFAT bind mount, and removeOldLogs' lstat on them throws EPERM,
      # which kills Deemix at startup (uncaughtException).
      - deemix-logs:/config/logs
    restart: 'unless-stopped'

  # --- Lidarr stack (imported from ../lidarr-stack) ---
  # The arr services run as ${PUID}:${PGID} from .env (502:20 on this host);
  # flaresolverr, gluetun and tailscale run as their image users. Inter-service
  # addresses use the *.internal network aliases — the routed services' aliases
  # live on gluetun below; plain service names resolve too.
  #
  # prowlarr, slskd, flaresolverr and transmission are "routed": they share
  # gluetun's network namespace so all their traffic egresses through the
  # IPVanish tunnel (spec 0005 —
  # docs/explanation/specs/0005-gluetun-vpn-tailscale.md and
  # docs/explanation/research/gluetun-vpn-tailscale-research.md). Their ports
  # are published on gluetun, not on the services themselves.

  # Gluetun: IPVanish OpenVPN client. The routed services join this netns and
  # reach each other on localhost inside it; their kill switch is gluetun's
  # firewall. IPVanish forwards nothing inbound, so the peer ports below are
  # LAN-reach only. The image ships a HEALTHCHECK, so service_healthy below
  # waits for the tunnel, not just container start.
  gluetun:
    container_name: gluetun
    networks:
      default:
        aliases:
          - gluetun.internal
          # Aliases moved off the routed services (a routed service can't carry
          # network aliases) so soularr/config.ini and Lidarr's download-client
          # URLs keep resolving unmodified.
          - prowlarr.internal
          - slskd.internal
          - transmission.internal
          - flaresolverr.internal
    # Pinned: :v3 is the rolling stable line per the gluetun wiki; :latest tracks
    # the master edge. Re-check the research doc before upgrading.
    image: qmcgaw/gluetun:v3
    restart: unless-stopped
    logging:
      driver: json-file
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=ipvanish
      - VPN_TYPE=openvpn                        # default; explicit for clarity
      - OPENVPN_USER=${OPENVPN_USER}            # IPVanish account email — in .env
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}    # IPVanish account password — in .env
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Netherlands}
      # Docker's embedded DNS, so routed apps still resolve non-routed service
      # names (lidarr.internal for Prowlarr's app sync). Trades away gluetun's
      # Unbound/DoT + blocklists; DNS_KEEP_NAMESERVER is a documented leak risk.
      - DNS_ADDRESS=127.0.0.11
      - TZ=${TZ}
      # - UPDATER_PERIOD=168h                   # optional: refresh IPVanish server list
      # - FIREWALL_OUTBOUND_SUBNETS=192.168.178.0/24  # only if a routed app must
      #                                             # initiate to physical LAN IPs
    ports:
      # Every port a routed service used to publish lives here:
      - "9696:9696"            # prowlarr UI
      - "5030:5030"            # slskd web UI (HTTP)
      - "5031:5031"            # slskd web UI (HTTPS, self-signed)
      - "50300:50300"          # slskd Soulseek listen port (LAN-side only —
                               # IPVanish accepts nothing inbound)
      - "9091:9091"            # transmission UI/RPC
      - "51413:51413"          # transmission peer port (LAN-side only)
      - "51413:51413/udp"
      - "8191:8191"            # flaresolverr API — LAN/host reach; prowlarr uses
                               # localhost:8191 inside the shared netns
      # - "8000:8000"          # gluetun control server (unused by the stack)

  prowlarr:
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ./prowlarr:/config
      # Logs on a named volume — ._ sidecars EPERM on stat in-container (see deemix).
      - prowlarr-logs:/config/logs
      - ${DATA_DIR}:/data

  # FlareSolverr: solves Cloudflare challenges for Prowlarr indexers tagged to use it
  # (see docs/explanation/research/flaresolverr-research.md). Stateless — no config volume.
  # The image runs as a fixed flaresolverr user; PUID/PGID are not supported.
  flaresolverr:
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    environment:
      - LOG_LEVEL=info   # set to debug when troubleshooting solves
      - TZ=${TZ}
    # Browser profiles are written per-request; RAM-backing spares the SSD.
    tmpfs:
      - /tmp:size=256M,mode=1777

  lidarr:
    container_name: lidarr
    hostname: lidarr.internal
    networks:
      default:
        aliases:
          - lidarr.internal
    image: ghcr.io/hotio/lidarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - "8686:8686"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ./lidarr:/config
      # Logs on a named volume — ._ sidecars EPERM on stat in-container (see deemix).
      - lidarr-logs:/config/logs
      - ${DATA_DIR}:/data

  transmission:
    container_name: transmission
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    logging:
      driver: json-file
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Uncomment to set a web UI login (otherwise no auth on the RPC port);
      # values come from .env.
      # - USER=${TRANSMISSION_USER}
      # - PASS=${TRANSMISSION_PASS}
    volumes:
      - ./transmission:/config
      - ${DATA_DIR}/torrents:/data/torrents

  soularr:
    container_name: soularr
    hostname: soularr.internal
    networks:
      default:
        aliases:
          - soularr.internal
    image: mrusse08/soularr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    ports:
      - "8265:8265"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - SCRIPT_INTERVAL=300
      - WEBUI_ENABLED=true
    volumes:
      - ${DATA_DIR}/slskd/downloads:/downloads
      - ${DATA_DIR}/slskd/incomplete:/incomplete
      # config.ini (untracked — holds the Lidarr and slskd API keys) lives here;
      # see config.ini.example for the shape.
      - ./soularr:/data

  slskd:
    container_name: slskd
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    image: slskd/slskd
    restart: unless-stopped
    logging:
      driver: json-file
    user: "${PUID}:${PGID}"
    environment:
      - UMASK=002
      - SLSKD_REMOTE_CONFIGURATION=true
      - TZ=${TZ}
      # Credentials come from .env, not slskd.yml (env vars lose to YAML keys
      # when both are set — the yml deliberately leaves these unset).
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
    volumes:
      - ./slskd:/app
      # Logs on a named volume — ._ sidecars EPERM on stat in-container (see deemix).
      - slskd-logs:/app/logs
      - ${DATA_DIR}/slskd/downloads:/downloads
      - ${DATA_DIR}/slskd/incomplete:/incomplete
      - ${DATA_DIR}/media:/data:ro
      - ${MUSIC_DIR:-/Volumes/512GB SSD/Music}/Deemix:/deemix:ro

  # Tailscale sidecar: serves every web UI to the tailnet over HTTPS per
  # tailscale/serve.json (spec 0005 — docs/explanation/specs/0005-gluetun-vpn-tailscale.md
  # and docs/explanation/research/gluetun-vpn-tailscale-research.md). It keeps its
  # own netns on the default network — routing it through gluetun would force
  # tailscaled's control/DERP/peer traffic through IPVanish and kill direct
  # tailnet paths. Routed apps are proxied via gluetun:<port>, non-routed ones
  # by service name.
  tailscale:
    container_name: tailscale
    image: tailscale/tailscale:latest
    restart: unless-stopped
    logging:
      driver: json-file
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}                # reusable, ephemeral-OK key tagged
                                                # tag:container — in .env
      - TS_STATE_DIR=/var/lib/tailscale         # persisted below; without it the
                                                # node re-registers every recreate
      - TS_HOSTNAME=musicstack
      - TS_SERVE_CONFIG=/config/serve.json
      # Tagged nodes don't expire — an untagged node's key dies on the tailnet
      # expiry schedule and remote access silently goes dark.
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      # Live serve.json is git-ignored (its Web keys embed the real tailnet
      # FQDN); copy serve.json.example and fill it in — see
      # docs/how-to/vpn-and-tailscale-access.md. Single-file mount: edits
      # aren't picked up live — `--force-recreate tailscale` after changing it.
      - ./tailscale/serve.json:/config/serve.json:ro

volumes:
  deemix-logs:
  jellyfin-logs:
  prowlarr-logs:
  lidarr-logs:
  slskd-logs:
