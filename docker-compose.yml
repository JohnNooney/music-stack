services:
  jellyfin:
    # Pinned: album grouping (one folder = one album) and playlist behaviour the library layout relies on
    # were verified against 12.4. Re-check docs/jellyfin-music-metadata-research.md before upgrading.
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 501:501
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /Users/john/Docker/jellyfin/config:/config
      - /Users/john/Docker/jellyfin/cache:/cache
      # /media is the union root built by union_library (ADR 0004); the source trees are
      # mounted read-only at sibling paths purely so its relative symlinks resolve in-container.
      - type: bind
        source: /Users/john/Music/Jellyfin
        target: /media
      - type: bind
        source: /Users/john/Music/Deemix
        target: /Deemix
        read_only: true
      - type: bind
        source: /Users/john/Music/Lidarr
        target: /Lidarr
        read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.50.33
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  deemix:
    # Pinned: reorganize_playlists replicates this version's path generation (Deemix path).
    # Re-check pathtemplates.ts before upgrading.
    image: ghcr.io/bambanah/deemix:v4.8.0
    container_name: deemix
    environment:
      - PUID=501
      - PGID=501
    ports:
      - 6595:6595
    volumes:
      - type: bind
        source: /Users/john/Music/Deemix
        target: /downloads
      # Config (credentials, queue, logs) lives in this repo, git-ignored, never in the scanned library.
      - /Users/john/Docker/jellyfin/deemix-config:/config
    restart: 'unless-stopped'
